<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* CSS beats presentation attributes, so fill/stroke are set here in
       full rather than half here and half on the elements. */
    .ground { fill: #000000; }
    .stroke { fill: none; stroke: #a8c3e8; }
    .solid { fill: #a8c3e8; stroke: none; }
    @media (prefers-color-scheme: light) {
      .ground { fill: #f0efec; }
      .stroke { stroke: #3567a8; }
      .solid { fill: #3567a8; }
    }
  </style>
  <rect class="ground" width="32" height="32" />
  <!-- The "AI" of AIRCRAFT, in the blue the console uses for model output. -->
  <path class="stroke" d="M 3.5 27 L 12 5 L 20.5 27" stroke-width="4" stroke-linejoin="miter" />
  <path class="stroke" d="M 6 20.5 H 18" stroke-width="3.2" />
  <rect class="solid" x="25.5" y="5" width="4" height="22" />
</svg>
